<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Songbook</title>

    <meta name="theme-color" content="#fff7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171216" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#9c27b0" />
    <meta name="apple-mobile-web-app-title" content="Songbook" />
    <meta name="application-name" content="Songbook" />
    <meta name="msapplication-TileColor" content="#9c27b0" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:wght@400;500&display=swap"
    />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>

    <div id="root">
      <!-- Shown until the app starts; mirrors the sign-in screen so the hand-over is seamless. -->
      <style>
        .splash {
          --surface: #fff7fa;
          --on-surface: #1f1a1f;
          --container: #ffd6fe;
          --on-container: #7b008f;
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          background: var(--surface);
          color: var(--on-surface);
          font-family: 'Roboto Flex', Roboto, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
          .splash {
            --surface: #171216;
            --on-surface: #ebdfe6;
            --container: #7b008f;
            --on-container: #ffd6fe;
          }
        }
        .splash-logo {
          width: 88px;
          height: 88px;
          border-radius: 28px;
          display: grid;
          place-items: center;
          margin: 0 auto 24px;
          background: var(--container);
          color: var(--on-container);
        }
        .splash h1 {
          font-size: 2rem;
          line-height: 2.5rem;
          font-weight: 500;
          margin: 0;
        }
      </style>
      <div class="splash">
        <div>
          <div class="splash-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 512 512" aria-hidden="true">
              <path
                fill="currentColor"
                d="M511.99 32.01c0-21.71-21.1-37.01-41.6-30.51L150.4 96c-13.3 4.2-22.4 16.5-22.4 30.5v261.42c-10.05-2.38-20.72-3.92-32-3.92-53.02 0-96 28.65-96 64s42.98 64 96 64 96-28.65 96-64V214.31l256-75.02v184.63c-10.05-2.38-20.72-3.92-32-3.92-53.02 0-96 28.65-96 64s42.98 64 96 64 96-28.65 96-64l-.01-351.99z"
              ></path>
            </svg>
          </div>
          <h1>Songbook</h1>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
